aid: cuyana
name: Cuyana
description: >-
  Cuyana is a San Francisco-based direct-to-consumer women's fashion brand founded in 2011 by
  Karla Gallardo and Shilpa Shah, built on a "Fewer, Better Things" philosophy of timeless,
  high-quality essentials — leather totes and handbags, small leather goods, and apparel —
  crafted from sustainable, Leather Working Group (LWG) certified materials through ethical
  manufacturing partnerships. The brand runs an omnichannel direct-to-consumer business across
  its e-commerce store and a growing fleet of retail locations. Cuyana's storefront runs on
  Shopify, which exposes agent-facing surfaces on the cuyana.com domain: a live hosted Storefront
  MCP server at /api/mcp for AI shopping agents (search_catalog, get_cart, update_cart,
  get_product_details, search_shop_policies_and_faqs), and Shopify Customer Account OAuth/OIDC
  discovery documents under /.well-known/. Cuyana is backed by Canaan Partners.
